# Geoclue ayarı: /etc/geoclue/conf.d/ altına kopyalanır.

# Wi-Fi ile konum bulma: çevredeki Wi-Fi ağlarından konum tahmini (BeaconDB, anahtarsız).
# Bu satır olmadan geoclue Wi-Fi kaynağını kapatır.
[wifi]
enable=true
url=https://api.beacondb.net/v1/geolocate
submit-data=false

# Kocaeli Ulaşım'a konum izni. KDE Plasma geoclue'ya izin soran bir aracı (agent) sağlamadığı
# için izin burada verilir.
[dev.enaimami.KocaeliUlasim]
allowed=true
system=true
users=
